[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gewu-core"
version = "0.1.0"
description = "Shared bootstrap, infrastructure, and utility primitives for Gewu"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["agent", "infrastructure", "configuration", "observability"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = [
    "cryptography==48.0.0",
    "filelock==3.29.0",
    "pydantic==2.13.4",
    "python-dotenv==1.2.2",
    "pyyaml==6.0.3",
]

[project.optional-dependencies]
apollo = ["httpx==0.28.1"]
database = [
    "aiomysql==0.3.2",
    "aiosqlite==0.22.1",
    "greenlet==3.5.0",
    "sqlalchemy==2.0.49",
]
redis = ["redis==6.4.0"]
http = [
    "fastapi==0.136.1",
    "starlette==1.0.0",
    "uvicorn==0.46.0",
]
all = [
    "aiomysql==0.3.2",
    "aiosqlite==0.22.1",
    "fastapi==0.136.1",
    "greenlet==3.5.0",
    "httpx==0.28.1",
    "redis==6.4.0",
    "sqlalchemy==2.0.49",
    "starlette==1.0.0",
    "uvicorn==0.46.0",
]

[project.urls]
Homepage = "https://gitee.com/simbaorz/gewu"
Repository = "https://gitee.com/simbaorz/gewu.git"
Issues = "https://gitee.com/simbaorz/gewu/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/gewu_core"]

[tool.hatch.build.targets.sdist]
include = ["/LICENSE", "/README.md", "/pyproject.toml", "/src", "/tests"]
