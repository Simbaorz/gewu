[project]
name = "gewu-workspace"
version = "0.1.0"
description = "Development workspace for the Gewu embeddable Agent Runtime"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = []

[dependency-groups]
dev = [
    "aiosqlite>=0.21.0",
    "black>=26.3.1",
    "fakeredis>=2.32.0",
    "hatchling>=1.31.0",
    "mypy>=1.19.0",
    "python-multipart==0.0.30",
    "pytest>=9.0.0",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.14.0",
    "types-pyyaml>=6.0.12.20260724",
]

[tool.uv]
package = false
index-url = "https://mirrors.aliyun.com/pypi/simple"

[tool.uv.workspace]
members = [
    "packages/gewu-core",
    "packages/agent-runtime",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = [
    "packages/agent-runtime/tests",
    "packages/gewu-core/tests",
    "tests",
]
addopts = ["-ra", "--strict-config", "--strict-markers", "--import-mode=importlib"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = [
    "packages/agent-runtime/src",
    "packages/agent-runtime/tests",
    "packages/gewu-core/src",
    "packages/gewu-core/tests",
    "tests",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = [
    "gewu_agent_runtime",
    "gewu_core",
]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
mypy_path = "packages/agent-runtime/src:packages/gewu-core/src"
packages = [
    "gewu_agent_runtime",
    "gewu_core",
]
disallow_untyped_defs = true
check_untyped_defs = true
warn_return_any = true
warn_unused_configs = true
